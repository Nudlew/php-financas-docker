version: "3.9"

services:
  app:
    build: .
    container_name: ${APP_CONTAINER}
    restart: always
    ports:
      - "${APP_PORT}:80"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      MAIL_TO: ${MAIL_TO}

  db:
    image: postgres:15
    container_name: ${DB_CONTAINER}
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data_homolog:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./reports:/var/www/html/reports

volumes:
  postgres_data_homolog:
